:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);text-align:center}#rchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}#rchips button{white-space:nowrap;flex:none}#vw button[data-v=tges]{color:var(--bl);border-color:var(--bl)}#vw button.on[data-v=tges]{background:var(--bl);color:var(--on);border-color:var(--bl)}#vw button[data-v=tsai]{color:var(--gr);border-color:var(--gr)}#vw button.on[data-v=tsai]{background:var(--gr);color:var(--on);border-color:var(--gr)}#vw button[data-v=gen]{color:var(--pk);border-color:var(--pk)}#vw button.on[data-v=gen]{background:var(--pk);color:var(--on);border-color:var(--pk)}#vw button[data-v=veau]{color:var(--tx);border-color:var(--tx)}#vw button.on[data-v=veau]{background:var(--tx);color:var(--bg);border-color:var(--tx)}.bdg{font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;white-space:nowrap;color:var(--on)}.bg-g{background:var(--bl)}.bg-t{background:var(--pu)}.bg-s{background:var(--gr)}.bg-o{background:var(--rd)}.bg-p{background:var(--pk)}.bg-v{background:var(--tx);color:var(--bg)}.bg-r{background:var(--og)}

<script>
const D0=Date.UTC(1840,11,31),DAY=864e5;
const toDate=n=>new Date(D0+n*DAY),fmt=n=>toDate(n).toISOString().slice(0,10);
const todayN=Math.floor((Date.now()-D0)/DAY);
const LBL={NAIS:'Naissance',SAIL:'Saillie',SAILF:'Saillie fécondante',GST:'Test de gestation',VELA:'Vêlage',TAR:'Tarissement',VACC:'Vaccin',ELIM:'Élimination',CHAL:'Chaleur',CHIN:'Hormone',TX:'Traitement',POUB:'Traitement',RP:'Rétention placentaire',OMA:'Mammite',MAMM:'Mammite',SX:'Symptômes',DYST:'Vêlage difficile',PLOC:'Pattes',REF:'Raison de réforme',SUPP:'Supplément',FV:'Fièvre du lait',EXM:'Examen',AVOR:'Avortement',PREP:'Préparation',DIAR:'Diarrhée',EXC:'Examen clinique'};
const ELM={VABA:'vente abattoir',MORT:'morte',MAMM:'mammite',VLAI:'vente laitière',EUTH:'euthanasie'};
const REF={REP:'reproduction',FPRO:'faible production',RLOC:'pattes',TDIF:'traite difficile',AGE:'âge',AUTR:'autre',MAMM:'mammite'};
function parse(txt){
 const L=txt.split(/\r?\n/),cows={};
 const info=(L[0]||'').match(/(\d{4}-\d\d-\d\d)/);
 for(const l of L){
  let m=l.match(/^\^va\((\d+)\)=(.*)$/);
  if(m){const h=m[2].split('\\');cows[m[1]]={id:m[1],num:h[0],nom:(h[1]||'').trim(),natl:h[3]||'',flag:(h[5]||'').trim(),naiss:+h[4]||0,lact:+h[6]||0,ev:[]};continue}
  m=l.match(/^\^va\((\d+),(\d+),"(\w+)"\)=(.*)$/);
  if(m&&cows[m[1]])cows[m[1]].ev.push({d:+m[2],t:m[3],raw:m[4]});
 }
 const arr=Object.values(cows);
 for(const c of arr){
  c.ev.sort((a,b)=>a.d-b.d);
  const last=t=>[...c.ev].reverse().find(e=>e.t===t);
  c.elim=c.flag==='E'?(last('ELIM')||{d:0,t:'ELIM',raw:''}):null;const v=last('VELA');c.vela=v&&v.d;
  const sf=c.ev.filter(e=>e.t==='SAILF'||e.t==='SAIL').pop();c.sail=sf;
  const vd=c.vela||0,brs=c.ev.filter(e=>(e.t==='SAIL'||e.t==='SAILF')&&e.d>vd),lb=brs[brs.length-1]||null;c.lb=lb;c.gstAfter=!!lb&&c.ev.some(e=>e.t==='GST'&&e.d>lb.d);c.tarAfter=!!lb&&c.ev.some(e=>e.t==='TAR'&&e.d>lb.d);
  let ns=0,pd=-99;for(const b of brs){if(b.d-pd>3)ns++;pd=b.d}c.nServ=ns;
  const lf=[...brs].reverse().find(e=>e.t==='SAILF')||null;c.lf=lf;
  c.gest=!!(lf&&!brs.some(e=>e.d>lf.d+3)&&!c.elim);
  c.prevu=c.gest?lf.d+280:0;c.nbVela=c.ev.filter(e=>e.t==='VELA').length;
 }
 return {cows:arr,date:info?info[1]:''};
}
function pretty(e){
 const parts=e.raw.split('\\').filter(Boolean);
 const out=[];
 for(const p of parts){
  const i=p.indexOf('|');
  if(i<0){out.push(p);continue}
  const k=p.slice(0,i),r=p.slice(i+1);
  if(k==='COM'||k==='MESS'){if(r.trim())out.push(r.trim());continue}
  if(k==='IA'){out.push('IA taureau '+r.replace(/[;\s]+$/,''));continue}
  if(k==='INSE'){const o={};r.split(';').forEach(x=>{const [a,b]=x.split('=');o[a]=b});out.push('Taureau '+(o.NomTaureau||'')+' ('+(o.CodeTaureau||'')+')');continue}
  if(r.includes(';')){const [nm,...rest]=r.split(';'),o={};rest.forEach(x=>{const [a,b]=x.split('=');o[a]=b});
   out.push((nm||k)+(o.DOSE?' · dose '+o.DOSE:'')+(o.VET?' · '+o.VET.trim():''));continue}
  out.push(k+' '+r);
 }
 if(e.t==='VELA'){const g=e.raw;const sx=[];if(/JU\\/.test(g))sx.push('jumeaux');
  const mm=[...g.matchAll(/(MA|FE)\|(\S*)/g)].map(x=>(x[1]==='MA'?'mâle':'femelle')+(x[2]?' n° '+x[2].replace(/\[.*/,''):''));
  const mn=/MORN/.test(g)?' (mort-né)':'';return sx.concat(mm).join(', ')+mn+(/TAU#\|([^\\]+)/.test(g)?' · taureau '+g.match(/TAU#\|([^\\]+)/)[1]:'')+(out.filter(x=>x.length>12&&!/ATQ|Vigoureux|Saillie|^TAU#/.test(x)).length?' — '+out.filter(x=>x.length>12&&!/ATQ|Vigoureux|^TAU#/.test(x)).join('; '):'')}
 if(e.t==='ELIM'){const c=parts.map(p=>(p.split('|')[0])).filter(x=>ELM[x]).map(x=>ELM[x]);return c.join(', ')+(out.filter(x=>!ELM[x]&&!/^(MAMM|MORT|VABA|VLAI|EUTH)/.test(x)).length?' — '+out.filter(x=>!ELM[x]&&!/^(MAMM|MORT|VABA|VLAI|EUTH)/.test(x)).join('; '):'')}
 if(e.t==='REF')return parts.map(p=>{const k=p.split('|')[0],r=p.split('|').slice(1).join('|');return k==='COM'?r:(REF[k]||k)+(r?' ('+r+')':'')}).join(', ');
 return out.join(' ; ');
}
let DB=null,view='actives',q='',tab='fiches',rwin=7,sel=null;
let grp=[];
const $=id=>document.getElementById(id);
const age=c=>{if(!c.naiss)return'';const mo=Math.floor((todayN-c.naiss)/30.44);return mo<24?mo+' mois':(mo/12).toFixed(1).replace('.',',')+' ans'};
function etat(c){
 if(c.elim)return '<span class="tag">éliminée</span>';
 const st=stat(c);if(!st)return'';
 const mo=c.naiss?(todayN-c.naiss)/30.44:0;
 const k=c.gest?(c.tarAfter&&c.vela?'tar':'ges'):c.lb?'sai':c.vela?'vel':(mo<6?'vo':'gen');
 let t='';
 if(k==='ges'){const d=c.prevu-todayN;t='<span class="s-g">'+(c.vela?'Gestante':'Taure gestante')+(c.vela?' · ':'<br>')+(d>=0?'dans '+d+' j':'dépassé '+(-d)+' j')+'</span>'}
 else if(k==='tar'){const d=c.prevu-todayN;t='<span class="s-t">Tarie · '+(d>=0?'dans '+d+' j':'dépassé '+(-d)+' j')+'</span>'}
 else if(k==='sai')t='<span class="s-s">'+(c.vela?'Saillie':'Taure saillie')+(c.vela?' · ':'<br>')+(todayN-c.lb.d)+' j</span>';
 else if(k==='vel')t='<span class="s-o">Vache ouverte · '+(todayN-c.vela)+' j</span>';
 else if(k==='gen'&&mo>=13)t='<span class="s-o">Taure ouverte</span>';
 else if(k==='gen')t='<span class="s-p">Génisse</span>';
 else if(k==='vo')t='<span class="s-v">Veau</span>';
 if(st[0]==='ref')t+=(t?'<br>':'')+'<span class="s-r" style="font-size:12px">✕ réformée</span>';
 return t;
}
const kind=c=>c.elim?'':(c.flag==='R'?'ref':kind0(c));
const kind0=c=>{if(c.elim)return'';const mo=c.naiss?(todayN-c.naiss)/30.44:0;return c.gest?(c.tarAfter&&c.vela?'tar':'ges'):c.lb?'sai':c.vela?'vel':(mo<6?'vo':'gen')};
const moisAge=c=>c.naiss?(todayN-c.naiss)/30.44:0;
const VIEWS={actives:c=>!c.elim,elim:c=>!!c.elim,ges:c=>kind(c)==='ges'&&!!c.vela,tges:c=>kind(c)==='ges'&&!c.vela,tar:c=>kind(c)==='tar',vel:c=>kind(c)==='vel'&&todayN-c.vela<40,ouv:c=>kind(c)==='vel'&&todayN-c.vela>=40,taur:c=>kind(c)==='gen'&&moisAge(c)>=13,sai:c=>kind(c)==='sai'&&!!c.vela,tsai:c=>kind(c)==='sai'&&!c.vela,veau:c=>kind(c)==='vo',gen:c=>kind(c)==='gen'&&moisAge(c)<13,ref:c=>!c.elim&&c.flag==='R'};
const VLBL=[['actives','Actives'],['ges','Vaches gestantes'],['tges','Taures gestantes'],['tar','Taries'],['vel','Fraîches vêlées'],['ouv','Vaches ouvertes'],['taur','Taures ouvertes'],['sai','Vaches saillies'],['tsai','Taures saillies'],['gen','Génisses'],['veau','Veaux'],['ref','Réformées'],['elim','Éliminées']];
function renderViews(){$('vw').innerHTML=VLBL.map(([v,l])=>`<button data-v="${v}"${v===view?' class="on"':''}>${l} <small>${DB.cows.filter(VIEWS[v]).length}</small></button>`).join('')}
let SORT={k:'num',d:1};try{const s=JSON.parse(localStorage.getItem('dsa_sort')||'null');if(s&&['num','nom','age'].includes(s.k))SORT={k:s.k,d:s.d===-1?-1:1}}catch(e){}
const numCmp=(x,y)=>x.num.localeCompare(y.num,'fr',{numeric:true});
function sortCows(a){const d=SORT.d;return a.sort((x,y)=>{
 if(SORT.k==='nom'){const nx=(x.nom||'').trim(),ny=(y.nom||'').trim();if(!nx&&!ny)return numCmp(x,y);if(!nx)return 1;if(!ny)return -1;return nx.localeCompare(ny,'fr')*d||numCmp(x,y)}
 if(SORT.k==='age'){const ax=x.naiss||0,ay=y.naiss||0;if(!ax&&!ay)return numCmp(x,y);if(!ax)return 1;if(!ay)return -1;return (ax-ay)*d||numCmp(x,y)}
 return numCmp(x,y)*d})}
const SRTL={num:['Numéro','1→9','9→1'],nom:['Nom','A→Z','Z→A'],age:['Âge','vieilles→jeunes','jeunes→vieilles']};
function renderSort(){$('srt').innerHTML='<span class="mut" style="align-self:center">Trier :</span>'+Object.keys(SRTL).map(k=>`<button data-sk="${k}"${SORT.k===k?' class="on"':''}>${SRTL[k][0]}${SORT.k===k?' '+(SORT.d===1?SRTL[k][1]:SRTL[k][2]):''}</button>`).join('')}
$('srt').onclick=e=>{const b=e.target.closest('[data-sk]');if(!b)return;const k=b.dataset.sk;if(SORT.k===k)SORT.d=-SORT.d;else SORT={k,d:1};try{localStorage.setItem('dsa_sort',JSON.stringify(SORT))}catch(x){}list()};
function statusInfo(c){
 if(c.elim)return{col:'var(--mut)',lab:'Éliminée',sub:'',ref:false};
 const st=stat(c);if(!st)return null;
 const k=kind0(c),mo=moisAge(c),T=todayN;let col='var(--tx)',lab='Veau',sub='';
 if(k==='ges'){const d=c.prevu-T;col='var(--bl)';lab=c.vela?'Gestante':'Taure gestante';sub=d>=0?'dans '+d+' j':'dépassé '+(-d)+' j'}
 else if(k==='tar'){const d=c.prevu-T;col='var(--pu)';lab='Tarie';sub=d>=0?'dans '+d+' j':'dépassé '+(-d)+' j'}
 else if(k==='sai'){col='var(--gr)';lab=c.vela?'Saillie':'Taure saillie';sub=(T-c.lb.d)+' j'}
 else if(k==='vel'){col='var(--rd)';lab=(T-c.vela)<40?'Fraîche vêlée':'Vache ouverte';sub=(T-c.vela)+' j'}
 else if(k==='gen'&&mo>=13){col='var(--rd)';lab='Taure ouverte'}
 else if(k==='gen'){col='var(--pk)';lab='Génisse'}
 if(c.flag==='R')return{col:'var(--og)',lab:'Réformée',sub:lab+(sub?' · '+sub:''),ref:false};
 return{col,lab,sub,ref:false};
}
function list(){if(tab!=='fiches'){show();return}
 renderViews();renderSort();
 let a=DB.cows.filter(VIEWS[view]||VIEWS.actives);

  return `<h3>${t} <span class="tag">${pend.length}</span></h3><div class="mut">${sub}</div>`+(pend.length?pend.map(r=>`<div class="cow" data-id="${r.c.id}"><div><b>${r.c.num}</b> ${r.c.nom}<div class="mut">${r.text}</div></div><div style="display:flex;gap:6px;align-items:center">${r.dl!==undefined?rel(r.dl):r.tag?`<span class="tag">${r.tag}</span>`:''}<button class="dn" data-done="${r.key}" title="Marquer comme fait">✓</button></div></div>`).join(''):'<div class="mut" style="padding:6px 0 12px">Rien à signaler</div>')};
 const secs=sc('Retours de chaleur',`Saillie non confirmée · 1er cycle : ${RG.r1a} à ${RG.r1b} j de saillie · 2e cycle : ${RG.r2a} à ${RG.r2b} j`,tk.ret)
 +sc('Tests de gestation à faire',`Saillie de ${RG.ga} à ${RG.gb} jours, sans test depuis`,tk.tg)
 +sc('À inséminer',`Vaches de ${RG.ia} à ${RG.ib} j en lait sans saillie · génisses de ${RG.gm} mois et plus`,tk.ins)
 +sc('Vêlages à venir',`De ${RG.va} j de retard à ${RG.vb} j avant la date prévue (saillie fécondante + 280 j)`,tk.vel)
 +sc('Tarissements',`De ${RG.ta} à ${RG.tb} jours avant le vêlage prévu (tarissement ~60 j avant)`,tk.tar)
 +sc('Veaux à écorner',`Veaux de moins de 6 mois, dès ${RG.ecmin} j après la naissance${RG.ecmax==null?' (aucune limite maximale)':', jusqu’à '+RG.ecmax+' j'}`,tk.eco);
 const done=doneRows.length?`<h3 style="color:var(--mut)">Actions complétées <span class="tag">${doneRows.length}</span></h3><div class="mut">Touche ↩ pour remettre une vache dans sa liste.</div>`+doneRows.map(r=>`<div class="cow" data-id="${r.c.id}" style="filter:grayscale(1);opacity:.65"><div><b>${r.c.num}</b> ${r.c.nom}<div class="mut">${r.cat} · ${r.text}</div></div><div><button class="dn" data-done="${r.key}" title="Remettre dans la liste">↩</button></div></div>`).join(''):'';
 $('m').innerHTML=`<div class="row"><button data-rg="toggle">⚙ Réglages des jours</button></div>${rgOpen?rgpanel():''}`+secs+done;
 $('info').textContent='Régie · '+act.length+' actives · fichier du '+DB.date;
}

 const v=Math.max(0,Math.min(365,Math.round(+i.value)));ZONES[i.dataset.zk]=Number.isFinite(v)?v:ZDEF[i.dataset.zk];
 if(ZONES.p1<ZONES.p2)[ZONES.p1,ZONES.p2]=[ZONES.p2,ZONES.p1];
 if(ZONES.s1>ZONES.s2)[ZONES.s1,ZONES.s2]=[ZONES.s2,ZONES.s1];
 if(ZONES.dx1>ZONES.dx2)[ZONES.dx1,ZONES.dx2]=[ZONES.dx2,ZONES.dx1];
 saveZ();roulette()};

async function unzipTxt(buf){
 const dv=new DataView(buf);let e=buf.byteLength-22;
 while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
 if(e<0)throw new Error('zip invalide');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let i=0;i<n;i++){
  if(dv.getUint32(p,true)!==0x02014b50)break;
  const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lh=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(new Uint8Array(buf,p+46,nl));
  if(/Synchro.*\.txt$/i.test(name)){
   const st=lh+30+dv.getUint16(lh+26,true)+dv.getUint16(lh+28,true),data=new Uint8Array(buf,st,cs);
   if(meth===0)return new TextDecoder().decode(data);
   return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  }
  p+=46+nl+xl+cl;
 }
 throw new Error('fichier Synchro introuvable dans le zip');
}
function load(txt,save){DB=parse(txt);if(!DB.cows.length){$('m').innerHTML='<div class="empty">Fichier non reconnu.</div>';return}
 if(save)try{const r=indexedDB.open('vaches',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>{try{r.result.transaction('k','readwrite').objectStore('k').put(txt,'txt')}catch(e){}}}catch(e){}
 schedSoon();list()}

$('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 $('m').innerHTML='<div class="empty">Lecture de '+f.name+'…</div>';
 try{const buf=await f.arrayBuffer(),u=new Uint8Array(buf),zip=u[0]===0x50&&u[1]===0x4B;
  const txt=zip?await unzipTxt(buf):new TextDecoder().decode(buf);
  if(!/^DSA-SYNCHRO/.test(txt.trim().slice(0,20)))throw new Error('ce n’est pas un fichier Synchro de DSA ('+f.name+')');
  load(txt,true)}
 catch(err){$('m').innerHTML='<div class="empty">Impossible de lire ce fichier : '+err.message+'</div>'}};
try{const r=indexedDB.open('vaches',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');
 r.onsuccess=()=>{try{const g=r.result.transaction('k').objectStore('k').get('txt');g.onsuccess=()=>{if(g.result)load(g.result,false)}}catch(e){}}}catch(e){}

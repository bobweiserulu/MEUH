<script>
const D0=Date.UTC(1840,11,31),DAY=864e5;
const toDate=n=>new Date(D0+n*DAY);
const LS=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
let LANG=LS('dsa_lang','fr'),DFMT=LS('dsa_dfmt','dmy'),THEME=LS('dsa_theme','auto');
const LOC=()=>({fr:'fr-CA',en:'en-CA',es:'es'})[LANG]||'fr-CA';
const iso=n=>toDate(n).toISOString().slice(0,10);
const monShort=m=>{const s=new Intl.DateTimeFormat(LOC(),{month:'short',timeZone:'UTC'}).format(new Date(Date.UTC(2026,m,15))).replace('.','');return s.charAt(0).toUpperCase()+s.slice(1)};
const fmtWith=(n,f)=>{const d=toDate(n),y=d.getUTCFullYear(),m=d.getUTCMonth(),dd=d.getUTCDate(),p=x=>String(x).padStart(2,'0');
 return f==='ymd'?`${y}-${p(m+1)}-${p(dd)}`:f==='mdy'?`${p(m+1)}/${p(dd)}/${y}`:f==='dmyd'?`${p(dd)}-${p(m+1)}-${y}`:f==='txt'?`${dd} ${monShort(m)} ${y}`:`${p(dd)}/${p(m+1)}/${y}`};
const fmt=n=>fmtWith(n,DFMT);
const todayN=Math.floor((Date.now()-D0)/DAY);
const LBL={NAIS:'Naissance',SAIL:'Saillie',SAILF:'Saillie fécondante',GST:'Gestante',VELA:'Vêlage',TAR:'Tarissement',VACC:'Vaccin',ELIM:'Élimination',CHAL:'Chaleur',CHIN:'Hormone',TX:'Traitement',POUB:'Traitement',RP:'Rétention placentaire',OMA:'Mammite',MAMM:'Mammite',SX:'Symptômes',DYST:'Vêlage difficile',PLOC:'Pattes',REF:'Raison de réforme',SUPP:'Supplément',FV:'Fièvre du lait',EXM:'Examen',AVOR:'Avortement',PREP:'Préparation',DIAR:'Diarrhée',ECN:'Écornage',EXC:'Examen clinique'};
const ELM={VABA:'vente abattoir',MORT:'morte',MAMM:'mammite',VLAI:'vente laitière',EUTH:'euthanasie'};
const REF={REP:'reproduction',FPRO:'faible production',RLOC:'pattes',TDIF:'traite difficile',AGE:'âge',AUTR:'autre',MAMM:'mammite'};
function parse(txt){
 const L=txt.split(/\r?\n/),cows={};
 const info=(L[0]||'').match(/(\d{4}-\d\d-\d\d)(?:\s+(\d\d)(\d\d)\d\d)?/);
 for(const l of L){
  let m=l.match(/^\^va\((\d+)\)=(.*)$/);
  if(m){const h=m[2].split('\\');cows[m[1]]={id:m[1],num:h[0],nom:(h[1]||'').trim(),natl:h[3]||'',flag:(h[5]||'').trim(),naiss:+h[4]||0,lact:+h[6]||0,ev:[]};continue}
  m=l.match(/^\^va\((\d+),(\d+),"(\w+)"\)=(.*)$/);
  if(m&&cows[m[1]])cows[m[1]].ev.push({d:+m[2],t:m[3],raw:m[4]});
 }
 const arr=Object.values(cows);
 for(const c of arr){
  c.ev.sort((a,b)=>a.d-b.d);
  const last=t=>[...c.ev].reverse().find(e=>e.t===t);
  c.elim=c.flag==='E'?(last('ELIM')||{d:0,t:'ELIM',raw:''}):null;const v=last('VELA');c.vela=v&&v.d;
  const sf=c.ev.filter(e=>e.t==='SAILF'||e.t==='SAIL').pop();c.sail=sf;
  const vd=c.vela||0,brs=c.ev.filter(e=>(e.t==='SAIL'||e.t==='SAILF')&&e.d>vd),lb=brs[brs.length-1]||null;c.lb=lb;c.gstAfter=!!lb&&c.ev.some(e=>e.t==='GST'&&e.d>lb.d);c.tarAfter=!!lb&&c.ev.some(e=>e.t==='TAR'&&e.d>lb.d);
  let ns=0,pd=-99;for(const b of brs){if(b.d-pd>3)ns++;pd=b.d}c.nServ=ns;
  const lf=[...brs].reverse().find(e=>e.t==='SAILF')||null;c.lf=lf;
  c.gest=!!(lf&&!brs.some(e=>e.d>lf.d+3)&&!c.elim);
  c.prevu=c.gest?lf.d+280:0;c.nbVela=c.ev.filter(e=>e.t==='VELA').length;
 }
 const dn=info?Math.round((Date.UTC(+info[1].slice(0,4),+info[1].slice(5,7)-1,+info[1].slice(8,10))-D0)/DAY):null,tm=info&&info[2]?info[2]+':'+info[3]:'';
 return {cows:arr,get date(){return dn==null?'':fmt(dn)+(tm?' à '+tm:'')}};
}
function pretty(e){
 const parts=e.raw.split('\\').filter(Boolean);
 const out=[];
 for(const p of parts){
  const i=p.indexOf('|');
  if(i<0){out.push(p);continue}
  const k=p.slice(0,i),r=p.slice(i+1);
  if(k==='COM'||k==='MESS'){if(r.trim())out.push(r.trim());continue}
  if(k==='IA'){out.push('IA taureau '+r.replace(/[;\s]+$/,''));continue}
  if(k==='INSE'){const o={};r.split(';').forEach(x=>{const [a,b]=x.split('=');o[a]=b});out.push('Taureau '+(o.NomTaureau||'')+' ('+(o.CodeTaureau||'')+')');continue}
  if(r.includes(';')){const [nm,...rest]=r.split(';'),o={};rest.forEach(x=>{const [a,b]=x.split('=');o[a]=b});
   out.push((nm||k)+(o.DOSE?' · dose '+o.DOSE:'')+(o.VET?' · '+o.VET.trim():''));continue}
  out.push(k+' '+r);
 }
 if(e.t==='VELA'){const g=e.raw;const sx=[];if(/JU\\/.test(g))sx.push('jumeaux');
  const mm=[...g.matchAll(/(MA|FE)\|(\S*)/g)].map(x=>(x[1]==='MA'?'mâle':'femelle')+(x[2]?' n° '+x[2].replace(/\[.*/,''):''));
  const mn=/MORN/.test(g)?' (mort-né)':'';return sx.concat(mm).join(', ')+mn+(/TAU#\|([^\\]+)/.test(g)?' · taureau '+g.match(/TAU#\|([^\\]+)/)[1]:'')+(out.filter(x=>x.length>12&&!/ATQ|Vigoureux|Saillie|^TAU#/.test(x)).length?' — '+out.filter(x=>x.length>12&&!/ATQ|Vigoureux|^TAU#/.test(x)).join('; '):'')}
 if(e.t==='ELIM'){const c=parts.map(p=>(p.split('|')[0])).filter(x=>ELM[x]).map(x=>ELM[x]);return c.join(', ')+(out.filter(x=>!ELM[x]&&!/^(MAMM|MORT|VABA|VLAI|EUTH)/.test(x)).length?' — '+out.filter(x=>!ELM[x]&&!/^(MAMM|MORT|VABA|VLAI|EUTH)/.test(x)).join('; '):'')}
 if(e.t==='REF')return parts.map(p=>{const k=p.split('|')[0],r=p.split('|').slice(1).join('|');return k==='COM'?r:(REF[k]||k)+(r?' ('+r+')':'')}).join(', ');

 try{
  const pend=await LN.getPending();
  if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  if(!NT.on&&!PT.on&&!alarmPlan().length){NTSTATUS='Rappels et alertes désactivés.';return 'off'}
  let perm=await LN.checkPermissions();
  if(perm.display!=='granted')perm=await LN.requestPermissions();
  if(perm.display!=='granted'){NTSTATUS='Permission refusée : autorise les notifications pour l’application dans les réglages Android.';return 'perm'}
  const now=Date.now()+60000;
  const p1=NT.on?notifPlan().filter(p=>p.at.getTime()>now):[],p2=PT.on?protoPlan().filter(p=>p.at.getTime()>now):[];
  const all=p1.map((p,i)=>({id:1000+i,title:p.title,body:p.body,largeBody:p.body,schedule:{at:p.at,allowWhileIdle:true}})).concat(p2.map((p,i)=>({id:5000+i,title:p.title,body:p.body,largeBody:p.body,schedule:{at:p.at,allowWhileIdle:true}})));
  const p3=alarmPlan().filter(a=>a.at.getTime()>now);

  if(all.length)await LN.schedule({notifications:all});

function bullCode(e){const r=e.raw||'';let m=r.match(/(?:^|\\)IA\|([^;\\]*)/);if(m&&m[1].trim())return m[1].trim();m=r.match(/CodeTaureau=([^;\\]*)/);if(m&&m[1].trim())return m[1].trim();m=r.match(/(?:^|\\)ET\|([^;\\]*)/);if(m&&m[1].trim())return 'ET '+m[1].trim();return''}
function treatsOf(c){if(c._tr)return c._tr;const out=[];
 for(const e of c.ev){if(!e.raw||(e.raw.indexOf('RL=')<0&&e.raw.indexOf('RV=')<0))continue;
  for(const seg of e.raw.split('\\')){const i=seg.indexOf('|');if(i<0)continue;
   const rl=(seg.match(/RL=(\d+)/)||[])[1],rv=(seg.match(/RV=(\d+)/)||[])[1];
   if(+rl>0||+rv>0)out.push({d:e.d,prod:seg.slice(i+1).split(';')[0],rl:+rl||0,rv:+rv||0})}}
 return c._tr=out}
function delaisOf(c){
 if(c.elim)return null;
 const T=todayN,L=[],V=[];
 const add=(d,prod,rl,rv)=>{if(rl>0&&d+rl>=T)L.push({end:d+rl,prod});if(rv>0&&d+rv>=T)V.push({end:d+rv,prod})};
 for(const t of treatsOf(c))add(t.d,t.prod,t.rl,t.rv);
 for(const a of ACT)if(a.st==='p'&&(a.rl>0||a.rv>0)&&actHas(a,c))add(a.d,a.txt||actLbl(a.ty),a.rl,a.rv);
 const nl=c.num.toLowerCase();
 for(const it of PT.act){if(!it.cows.some(tk=>{const x=String(tk).toLowerCase();return nl===x||nl.startsWith(x+'-')}))continue;const t=tplOf(it.tpl);if(!t)continue;
  for(const s of t.steps){const D=it.start+s.d-1;if(D<=T&&(s.rl>0||s.rv>0))add(D,s.txt||t.name,+s.rl||0,+s.rv||0)}}
 if(!L.length&&!V.length)return null;
 const mx=a=>Math.max(...a.map(x=>x.end));
 return {lait:L.length?{end:mx(L),prods:[...new Set(L.map(x=>x.prod))]}:null,viande:V.length?{end:mx(V),prods:[...new Set(V.map(x=>x.prod))]}:null};
}
function delaiTag(c){const x=delaisOf(c);if(!x)return'';const T=todayN,p=[];if(x.lait)p.push('lait '+(x.lait.end-T)+' j');if(x.viande)p.push('viande '+(x.viande.end-T)+' j');return '⚠ Retrait '+p.join(' · ')}

const gdId=s=>{const m=String(s||'').match(/[-\w]{25,}/);return m?m[0]:''};
async function importBuf(buf,name){const u=new Uint8Array(buf),zip=u[0]===0x50&&u[1]===0x4B;const txt=zip?await unzipTxt(buf):new TextDecoder().decode(buf);
 if(!/^DSA-SYNCHRO/.test(txt.trim().slice(0,20)))throw new Error('ce n’est pas un fichier Synchro de DSA ('+name+')');load(txt,true)}
const b64buf=b=>{const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a.buffer};
const gdCH=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;
async function gdGet(url,type){const CH=gdCH();
 if(CH&&CH.get){const r=await CH.get({url,responseType:type==='bin'?'blob':'text',headers:{'User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'}});if(r.status!==200)throw new Error('réponse '+r.status);return type==='bin'?b64buf(r.data):String(r.data)}
 const r=await fetch(url);if(!r.ok)throw new Error('réponse '+r.status);return type==='bin'?await r.arrayBuffer():await r.text()}
const gdFile=id=>gdGet('https://drive.google.com/uc?export=download&id='+id,'bin');
function gdList(html){const out=[],seen=new Set(),re=/entry-([-\w]{20,})[\s\S]{0,1500}?flip-entry-title">([^<]*)</g;let m;
 while((m=re.exec(html))){if(seen.has(m[1]))continue;seen.add(m[1]);out.push({id:m[1],name:m[2].replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').trim()})}return out}
const nameStamp=n=>{const m=String(n).match(/(\d{4})-(\d\d)-(\d\d)[_ -]?(\d{2})(\d{2})(\d{2})/);return m?m.slice(1,7).join(''):''};
async function bufStamp(buf){const u=new Uint8Array(buf),txt=(u[0]===0x50&&u[1]===0x4B)?await unzipTxt(buf):new TextDecoder().decode(buf);const m=txt.slice(0,140).match(/(\d{4})-(\d\d)-(\d\d)\s+(\d\d)(\d\d)(\d\d)/);return m?m.slice(1,7).join(''):''}
async function gdPickFromFolder(fid,st){
 st('Lecture du dossier…');
 const L=gdList(await gdGet('https://drive.google.com/embeddedfolderview?id='+fid,'text')).filter(x=>/\.zip$/i.test(x.name));
 if(!L.length)throw new Error('aucun fichier .zip trouvé dans le dossier (est-il partagé avec « Toute personne disposant du lien » ?)');
 L.forEach(x=>x.s=nameStamp(x.name));
 const best=L.map(x=>x.s).sort().pop(),cands=L.filter(x=>x.s===best).slice(0,4);
 if(cands.length===1)return {buf:await gdFile(cands[0].id),name:cands[0].name};
 let win=null;
 for(const c of cands){const b=await gdFile(c.id),s=await bufStamp(b);if(!win||s>win.s)win={s,buf:b,name:c.name}}
 return win}
async function driveUpdate(silent){
 const st=m=>{GD.status=m;saveGD();const e=$('gdst');if(e)e.textContent=m};
 if(!GD.url){if(!silent){toast('Colle d’abord le lien Google Drive dans ⚙ Réglages.',6000);tab='reglages';TABS.forEach(x=>$(x).classList.remove('on'));show()}return}
 const fm=GD.url.match(/\/folders\/([-\w]{25,})/),id=fm?'':gdId(GD.url);
 if(!fm&&!id){st('Lien invalide.');if(!silent)toast('Lien Google Drive invalide.');return}
 const b=$('upd');if(b){b.disabled=true;b.textContent='…'}
 try{
  st('Téléchargement…');if(!silent)toast('Téléchargement…',20000);
  let buf,name='Google Drive';
  if(fm){const r=await gdPickFromFolder(fm[1],st);buf=r.buf;name=r.name}else buf=await gdFile(id);
  await importBuf(buf,name);
  GD.last=new Date().toLocaleString(LOC(),{dateStyle:'short',timeStyle:'short'});
  st('Dernière mise à jour : '+GD.last+' · fichier du '+(DB?DB.date:'?'));toast('Données mises à jour ✓ · fichier du '+(DB?DB.date:''));
 }catch(e){const msg=e.message+(gdCH()?'':' — cette fonction marche seulement dans l’application installée (APK)');st('Échec : '+msg);toast('Mise à jour impossible : '+msg,7000)}
 finally{if(b){b.disabled=false;b.textContent='⟳'}}
}

async function unzipTxt(buf){
 const dv=new DataView(buf);let e=buf.byteLength-22;
 while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
 if(e<0)throw new Error('zip invalide');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let i=0;i<n;i++){
  if(dv.getUint32(p,true)!==0x02014b50)break;
  const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lh=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(new Uint8Array(buf,p+46,nl));
  if(/Synchro.*\.txt$/i.test(name)){
   const st=lh+30+dv.getUint16(lh+26,true)+dv.getUint16(lh+28,true),data=new Uint8Array(buf,st,cs);
   if(meth===0)return new TextDecoder().decode(data);
   return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  }
  p+=46+nl+xl+cl;
 }
 throw new Error('fichier Synchro introuvable dans le zip');
}

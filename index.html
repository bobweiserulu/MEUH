let USER='';try{USER=localStorage.getItem('dsa_user')||''}catch(e){}
const saveUser=v=>{USER=v.trim();try{localStorage.setItem('dsa_user',USER)}catch(e){}};
function nameForm(){const old=$('usrmod');if(old)old.remove();const d=document.createElement('div');d.id='usrmod';
 d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px';
 d.innerHTML=`<div style="background:var(--bg);width:100%;max-width:420px;border-radius:16px;padding:16px"><h3 style="margin:0 0 6px">Bienvenue 👋</h3><div class="mut" style="margin-bottom:8px">Quel est ton nom ? Il sera inscrit sur les actions que tu entres, et le PC le recevra.</div><input id="usr-i" class="zi" style="width:100%;text-align:left;box-sizing:border-box" placeholder="Ton nom" value="${escH(USER)}" autocomplete="off"><div class="row" style="margin-top:12px;justify-content:flex-end"><button id="usr-x">Plus tard</button><button id="usr-ok" class="on">Enregistrer</button></div></div>`;
 document.body.appendChild(d);const i=$('usr-i');setTimeout(()=>i.focus(),100);
 const go=()=>{if(!i.value.trim()){toast('Entre ton nom.');return}saveUser(i.value);d.remove();toast('Bonjour '+USER+' ✓',2000);if(tab==='saisies')saisies()};
 $('usr-ok').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};$('usr-x').onclick=()=>d.remove()}
setTimeout(()=>{if(!USER)nameForm()},1200);
const BUILD='2026-11-27a';try{if(localStorage.getItem('dsa_build')!==BUILD){localStorage.setItem('dsa_build',BUILD);setTimeout(()=>toast('MEUH mise à jour ✓ ('+BUILD+')',4000),2600)}}catch(e){}
let FQ=0;

/* ===== 🐂 Choix de taureau : inventaire de semence + aide au choix (page retirable : tout est ici + 5 branchements marqués SEM) ===== */
let SEM=[],SEMLOG=[],SEMC={},SEMTAB='inv',SEMCOW=null,SEMQ='',SEMDEL=null,SEMDELT=0,PEDC=null;
try{SEM=JSON.parse(localStorage.getItem('dsa_sem')||'[]')||[];SEMLOG=JSON.parse(localStorage.getItem('dsa_semlog')||'[]')||[];SEMC=JSON.parse(localStorage.getItem('dsa_semc')||'{}')||{}}catch(e){}
const saveSEM=()=>{try{localStorage.setItem('dsa_sem',JSON.stringify(SEM));localStorage.setItem('dsa_semlog',JSON.stringify(SEMLOG.slice(-60)));localStorage.setItem('dsa_semc',JSON.stringify(SEMC))}catch(e){}};
const semK=s=>{s=String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const m=s.match(/^0*(\d{1,3})([A-Z]{1,3})0*(\d+)([A-Z]*)$/);return m?m[1]+m[2]+m[3]+m[4]:s};
const SEMREL=['','père de la vache','père de sa mère','père de sa grand-mère maternelle','père de son arrière-grand-mère maternelle'];
const semPct=f=>(+(f*100).toFixed(2)).toString().replace('.',',')+' %';
const semUid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const SEMCOL=['var(--gr)','#d4a300','#e08a00','var(--rd)'];
const iaKey=raw=>{const m=String(raw||'').match(/IA\|([^\\;]+)/);return m?semK(m[1]):''};
function pedGet(){if(PEDC&&PEDC.db===DB)return PEDC;
 const par={},stat={},fem={};
 for(const c of DB.cows)for(const e of c.evRaw){
  if(e.t==='VELA'){const tau=(e.raw.match(/TAU#\|([^\\]+)/)||[])[1]||'',tk=tau?semK(tau):'';
   for(const m of e.raw.matchAll(/(?:^|\\)(FE|MA)\|[^\\\[]*\[ATQ=(\d+)\]/g)){par[m[2]]={dam:c,sire:tk,tau:tau.trim(),d:e.d};if(m[1]==='FE'&&tk)fem[tk]=(fem[tk]||0)+1}}
  else if(e.t==='SAIL'||e.t==='SAILF'){const k=iaKey(e.raw);if(k){const s=stat[k]||(stat[k]={n:0,f:0});s.n++;if(e.t==='SAILF')s.f++}}}
 PEDC={db:DB,par,stat,fem};return PEDC}
const HXs=c=>{const x=typeof HX!=='undefined'&&c&&c.natl?HX[c.natl]:null;return x&&x.sire&&x.sire.n?x.sire.n:''};
const codeName=k=>{if(!k)return '';const b=SEM.find(x=>x.code&&semK(x.code)===k);if(b&&b.nm)return b.nm;const P=BP[bpKey(k)]||BPSEED[bpKey(k)];return P&&P.n||''};
const normN=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[*]+/g,' ').replace(/[^A-Z0-9 -]/g,' ').replace(/-/g,' ').replace(/\s+/g,' ').trim().replace(/( (ET|P|PP|RC|TV|TL|TY|TR|TD|TM))+$/,'').trim();
const nameHit=(a,b)=>{a=normN(a);b=normN(b);if(a.length<4||b.length<4)return false;return a===b||a.endsWith(' '+b)||b.endsWith(' '+a)};
function semChain(c){const P=pedGet(),ch=[],seen=new Set();let cur=c,g=1;
 while(cur&&g<=4&&cur.natl&&P.par[cur.natl]&&!seen.has(cur.id)){seen.add(cur.id);const p=P.par[cur.natl];ch.push({cow:cur,tau:p.tau,sk:p.sire,dam:p.dam,g,sn:HXs(cur)||codeName(p.sire)});cur=p.dam;g++}
 if(!ch.length){const n=HXs(c);if(n)ch.push({cow:c,tau:'',sk:'',dam:null,g:1,sn:n})}
 ch.cow=c;return ch}
function semRiskChain(b,ch){if(!ch||!ch.length)return{lvl:-1,F:0,why:[]};
 const P=bpGet(b),pd=P&&P.ped||[],bl=[[semK(b.code),b.nm,0,'Le taureau']];
 [[b.pere||pd[0],1,'Le père du taureau'],[b.mgs||pd[1],2,'Le père de la mère du taureau'],[pd[2],3,'Le père de sa grand-mère maternelle']].forEach(([v,n1,lb])=>{if(v)bl.push([semK(v),v,n1,lb])});
 let F=0;const why=[];
 for(const [k,nm,n1,lb] of bl)for(const x of ch){if(!((k&&x.sk&&x.sk===k)||(nm&&nameHit(nm,x.sn))))continue;const f=Math.pow(.5,n1+x.g+1);F+=f;why.push(lb+(n1?' ('+nm+')':'')+' = '+SEMREL[x.g]+(x.sn?' ('+x.sn+')':'')+' → '+semPct(f))}
 return{lvl:lvlOf(F),F,why,part:!(b.pere||b.mgs||pd.length)}}
function semHerd(b){const P=pedGet(),k=semK(b.code),s=P.stat[k],fi=P.fem[k]||0,a=[];
 if(s)a.push(s.n+' service'+(s.n>1?'s':'')+' · '+Math.round(100*s.f/s.n)+' % de conception'+(s.n<5?' (peu de données)':''));
 if(fi)a.push(fi+' fille'+(fi>1?'s':'')+' née'+(fi>1?'s':'')+' à la ferme');
 return a.join(' · ')}
function semOnCow(c,b){const k=semK(b.code),l=c.evRaw.filter(e=>(e.t==='SAIL'||e.t==='SAILF')&&iaKey(e.raw)===k);return l.length?'Déjà utilisé sur elle : '+l.length+' fois (dernière : '+fmt(l[l.length-1].d)+')':''}
const semBox='border:1px solid var(--ln);border-radius:12px;background:var(--card);padding:10px 12px;margin:8px 0';

function semences(){$('info').textContent='🐂 Choix de taureau';
 const tb=(k,t)=>`<button data-semt="${k}" class="${SEMTAB===k?'on':''}" style="flex:1;min-height:44px">${t}</button>`;
 $('m').innerHTML=`<div class="row" style="margin:6px 0">${tb('inv','📦 Inventaire')}${tb('aide','🎯 Aide au choix')}</div><div id="sem-b"></div>`;semBody()}
function semBody(){const b=$('sem-b');if(!b)return;b.innerHTML=SEMTAB==='inv'?semInv():semAide()}

function semInv(){const tot=SEM.reduce((a,b)=>a+(+b.doses||0),0),L=[...SEM].sort((a,b)=>(a.nm||a.code).localeCompare(b.nm||b.code));
 const card=b=>{const d=+b.doses||0,col=d===0?'var(--mut)':d<=2?'#e08a00':'var(--tx)';
  return `<div style="${semBox}${d===0?';opacity:.65':''}"><div style="display:flex;gap:8px;align-items:center"><div style="flex:1;min-width:0"><b style="font-size:17px">${escH(b.nm||b.code)}</b>${b.nm&&b.code?`<div class="mut">${escH(b.code)}</div>`:''}${b.pere||b.mgs?`<div class="mut" style="font-size:12px">${b.pere?'Père : '+escH(b.pere):''}${b.pere&&b.mgs?' · ':''}${b.mgs?'Père de la mère : '+escH(b.mgs):''}</div>`:''}${b.note?`<div style="font-size:13px;margin-top:2px">✚ ${escH(b.note)}</div>`:''}${bpLine(b)}</div>
  <div style="display:flex;align-items:center;gap:6px;flex:none"><button data-semx="dec" data-id="${b.id}" style="min-width:44px;min-height:44px;font-size:22px">−</button><div style="min-width:38px;text-align:center;font-size:24px;font-weight:800;color:${col}">${d}</div><button data-semx="inc" data-id="${b.id}" style="min-width:44px;min-height:44px;font-size:22px">＋</button></div></div>
  <div class="row" style="margin-top:6px;justify-content:flex-end"><button data-semx="inc10" data-id="${b.id}">＋10</button><button data-semx="edit" data-id="${b.id}">✎ Modifier</button><button data-semx="del" data-id="${b.id}"${SEMDEL===b.id?' class="on" style="background:var(--rd);border-color:var(--rd)"':''}>${SEMDEL===b.id?'Supprimer ?':'🗑'}</button></div></div>`};
 const lg=SEMLOG.slice(-8).reverse().map((l,i)=>{const ix=SEMLOG.length-1-i;return `<div style="display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--ln)"><div style="flex:1;min-width:0" class="mut">${fmt(l.d)} · <b>${escH(l.nm)}</b> −${l.n} → vache ${escH((l.cows||[]).join(', '))}</div><button data-semx="undo" data-i="${ix}" title="Remettre la dose">↩</button></div>`}).join('');
 return `<div class="row" style="margin:6px 0;justify-content:space-between;align-items:center"><span class="mut">${SEM.length} taureau${SEM.length>1?'x':''} · ${tot} dose${tot>1?'s':''}</span><button class="on" data-semx="add" style="min-height:44px">＋ Ajouter un taureau</button></div>`
  +(L.length?[1,2,3,4,5,6,''].map(cs=>{const g=L.filter(b=>String(b.cs||'')===String(cs));if(!g.length)return '';const n=g.reduce((a,b)=>a+(+b.doses||0),0);return `<div style="display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 2px"><b style="font-size:17px">${cs?'Casier '+cs:'Sans casier'}</b><span class="mut">${n} dose${n>1?'s':''}</span></div>`+g.map(card).join('')}).join(''):'<div class="empty">Aucun taureau pour l’instant.<br>Touche « Ajouter un taureau ».<br><br><button data-semx="seed" class="on" style="min-height:48px">📥 Charger mon inventaire papier (casiers 2, 3, 5, 6)</button></div>')
  +`<div style="${semBox}"><b>🧬 Profils des taureaux</b><div class="mut" style="font-size:12px;margin:2px 0 6px">Forces, faiblesses et pedigree, lus sur semex.com.</div><div class="row" style="gap:6px"><button data-semx="bpall" style="min-height:44px">🔄 Tout mettre à jour</button><button data-semx="bpweb" style="min-height:44px">🌐 Via le navigateur</button></div></div>`
  +(lg?`<h3 style="margin:16px 0 4px">Dernières utilisations</h3><div class="mut" style="font-size:12px;margin-bottom:4px">Une dose est retirée automatiquement quand tu enregistres une saillie avec le code du taureau. ↩ la remet.</div>${lg}`:'')}

function semForm(b){const old=$('semmod');if(old)old.remove();
 const o=document.createElement('div');o.id='semmod';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center';
 const zs='width:100%;text-align:left;box-sizing:border-box',lb=t=>`<label class="mut" style="display:block;margin-top:8px">${t}</label>`,v=x=>escH(b?b[x]||'':'');
 o.innerHTML=`<div style="background:var(--bg);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto"><h3 style="margin:0 0 4px">${b?'Modifier le taureau':'Ajouter un taureau'}</h3>
 ${lb('Nom')}<input id="sm-nm" class="zi" style="${zs}" value="${v('nm')}" autocomplete="off">
 ${lb('Code (ex. 200HO06400)')}<input id="sm-cd" class="zi" style="${zs}" value="${v('code')}" autocomplete="off" autocapitalize="characters">
 ${lb('Nombre de doses')}<input id="sm-ds" type="number" inputmode="numeric" min="0" class="zi" style="${zs}" value="${b?+b.doses||0:''}">
 ${lb('Casier dans la tank')}<select id="sm-cs" class="zi" style="${zs}"><option value="">— aucun —</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}"${b&&String(b.cs)===String(n)?' selected':''}>Casier ${n}</option>`).join('')}</select>
 ${lb('Père du taureau (code ou nom) — facultatif')}<input id="sm-pe" class="zi" style="${zs}" value="${v('pere')}" autocomplete="off">
 ${lb('Père de sa mère (code ou nom) — facultatif')}<input id="sm-mg" class="zi" style="${zs}" value="${v('mgs')}" autocomplete="off">
 ${lb('Points forts / notes — facultatif')}<input id="sm-nt" class="zi" style="${zs}" value="${v('note')}" placeholder="ex. pattes, pis, vêlage facile" autocomplete="off">
 <div class="mut" style="font-size:12px;margin-top:6px">Le père et le père de la mère servent à vérifier la parenté avec la vache (consanguinité).</div>
 <div class="row" style="margin-top:12px;justify-content:flex-end"><button data-smx="x">Annuler</button><button class="on" data-smx="ok">Enregistrer</button></div></div>`;
 document.body.appendChild(o);
 o.onclick=ev=>{const t=ev.target.closest('[data-smx]');if(ev.target===o||(t&&t.dataset.smx==='x')){o.remove();return}if(!t)return;
  const g=i=>($(i).value||'').trim(),nm=g('sm-nm'),cd=g('sm-cd').toUpperCase(),ds=Math.max(0,parseInt($('sm-ds').value)||0);
  if(!nm&&!cd){toast('Entre un nom ou un code.',2500);return}
  const f={nm,code:cd,doses:ds,cs:$('sm-cs').value,pere:g('sm-pe'),mgs:g('sm-mg'),note:g('sm-nt')};
  if(b)Object.assign(b,f);
  else{const k=cd?semK(cd):'',ex=k&&SEM.find(x=>x.code&&semK(x.code)===k);
   if(ex){ex.doses=(+ex.doses||0)+ds;for(const q of ['nm','cs','pere','mgs','note'])if(!ex[q]&&f[q])ex[q]=f[q];toast('Déjà dans l’inventaire : doses ajoutées ✓',3000)}
   else SEM.push(Object.assign({id:semUid()},f))}
  saveSEM();o.remove();semBody()}}

function semUse(a){try{const toks=String(a.txt||'').split(/[\s,;]+/).filter(Boolean),all=String(a.txt||'').trim().toUpperCase();
 const b=SEM.find(x=>(x.code&&toks.some(t=>semK(t)===semK(x.code)))||(x.nm&&x.nm.trim().toUpperCase()===all));if(!b)return;
 const n=a.cows.length;if((+b.doses||0)<=0){toast('🐂 '+(b.nm||b.code)+' : plus de doses en inventaire',4000);return}
 const k=Math.min(n,+b.doses);b.doses=(+b.doses)-k;SEMLOG.push({ts:Date.now(),d:a.d,id:b.id,nm:b.nm||b.code,n:k,cows:a.cows.map(x=>x.num)});saveSEM();
 toast('🐂 '+(b.nm||b.code)+' : '+b.doses+' dose'+(b.doses>1?'s':'')+' restante'+(b.doses>1?'s':''),3500);if(tab==='semence')semBody()}catch(e){}}

function semRes(){if(!SEMQ.trim())return '';const q=SEMQ.trim().toLowerCase();
 const L=DB.cows.filter(c=>!c.elim&&((c.num||'').toLowerCase().includes(q)||(c.nom||'').toLowerCase().includes(q))).slice(0,8);
 return L.length?L.map(c=>`<button data-semx="pick" data-id="${c.id}" style="display:block;width:100%;text-align:left;min-height:46px;margin:4px 0">${escH(c.num)} <b>${escH(c.nom||'')}</b> <span class="mut">· ${VSHORT[kind(c)]||''}</span></button>`).join(''):'<div class="mut" style="margin:6px 0">Aucune vache trouvée.</div>'}

function semAide(){if(!DB)return '<div class="empty">Charge d’abord un fichier DSA.</div>';
 const c=SEMCOW&&DB.cows.find(x=>x.id===SEMCOW);
 return `<input id="sem-q" type="search"${IM()} class="zi" style="width:100%;text-align:left;box-sizing:border-box" placeholder="Numéro ou nom de la vache" value="${escH(SEMQ)}" autocomplete="off"><div id="sem-r">${semRes()}</div>`
  +(c?semCow(c):'<div class="mut" style="margin:12px 0">Cherche une vache pour voir sa généalogie et les taureaux de ton inventaire, classés selon la parenté.</div>')}

function semCow(c){const ch=semChain(c),P=pedGet();
 const inv=k=>{const b=k&&SEM.find(x=>x.code&&semK(x.code)===k);return b&&b.nm?' <span class="mut">('+escH(b.nm)+')</span>':''};
 let ped;
 if(!ch.length)ped=`<div class="mut">Généalogie inconnue : cette vache n’est pas née à la ferme (ou son ATQ n’est pas dans le fichier). Le classement ne peut pas vérifier la parenté.</div>`;
 else{const last=ch[ch.length-1];ped=ch.map((x,i)=>`<div style="margin-left:${i*14}px;${i?'margin-top:2px':''}"><b>${i?'Mère':'Vache'} : ${escH(x.cow.num)} ${escH(x.cow.nom||'')}</b><div class="mut" style="margin-left:14px">Père : ${x.tau?escH(x.tau)+inv(x.sk):''}${x.sn?(x.tau?' · ':'')+escH(x.sn):(x.tau?'':'inconnu')}</div></div>`).join('')
  +(last.dam?`<div style="margin-left:${ch.length*14}px;margin-top:2px"><b>Mère : ${escH(last.dam.num)} ${escH(last.dam.nom||'')}</b> <span class="mut">(père inconnu)</span></div>`:'')}
 const N=cowNeeds(c),av=SEM.filter(b=>(+b.doses||0)>0).map(b=>{const r=semRisk(b,ch),beef=isBeef(b);return{b,r,h:semHerd(b),beef,f:beef?null:bpFit(b,c,N)}}),
  rate=b=>{const s=P.stat[semK(b.code)];return s&&s.n>=3?s.f/s.n:.5};
 av.sort((x,y)=>(x.beef-y.beef)||(bpTot(y.f,y.r)-bpTot(x.f,x.r))||(x.r.lvl-y.r.lvl)||(rate(y.b)-rate(x.b))||(x.b.nm||x.b.code).localeCompare(y.b.nm||y.b.code));
 av.filter(x=>!x.beef&&x.f&&x.f.fit!=null&&x.r.lvl<3).slice(0,3).forEach((x,i)=>{x.rk=i+1});
 const BT=['🟢 Aucun lien connu','🟡 Lien faible','🟠 Lien moyen','🔴 Lien élevé'];
 const cardB=({b,r,h,f,beef,rk})=>{const col=r.lvl<0?'var(--mut)':SEMCOL[r.lvl],on=semOnCow(c,b);
  return `<div style="${semBox};border-left:5px solid ${col}"><div style="display:flex;gap:8px;align-items:baseline"><div style="flex:1;min-width:0"><b style="font-size:17px">${rk?'⭐ ':''}${beef?'🥩 ':''}${escH(b.nm||b.code)}</b>${b.nm&&b.code?` <span class="mut">${escH(b.code)}</span>`:''}</div><span class="tag">${b.doses} dose${b.doses>1?'s':''}</span></div>
  <div style="color:${col};font-weight:700;margin:2px 0">${r.lvl<0?'⚪ Parenté non vérifiable':BT[r.lvl]+(r.F>0?' · +'+semPct(r.F)+' de consanguinité':'')+(r.part?' <span class="mut" style="font-weight:400;font-size:12px">· pedigree du taureau non chargé (🔄 dans Inventaire)</span>':'')}</div>
  ${bpPedLine(b)}
  ${r.why.map(w=>`<div class="mut" style="font-size:13px">• ${escH(w)}</div>`).join('')}
  ${bpFitHtml(f)}${beef?'<div class="mut" style="font-size:13px">Taureau de boucherie : pour une vache dont tu ne gardes pas la génisse.</div>':''}
  ${h?`<div class="mut" style="font-size:13px">À la ferme : ${escH(h)}</div>`:''}${on?`<div class="mut" style="font-size:13px">${escH(on)}</div>`:''}
  ${b.note?`<div style="font-size:13px;margin-top:2px">✚ ${escH(b.note)}</div>`:''}
  <div class="row" style="margin-top:6px;justify-content:flex-end"><button data-semx="why" data-id="${b.id}" data-cw="${c.id}">💡 Pourquoi</button><button data-semx="use" data-id="${b.id}" class="on">❤️ Utiliser sur ${escH(c.num)}</button></div></div>`};
 const none=SEM.filter(b=>(+b.doses||0)<=0);
 return `<div style="${semBox};margin-top:12px"><button data-open="${c.id}" style="float:right;min-height:40px">📋 Fiche</button><div style="font-size:18px;font-weight:800">${escH(c.num)} ${escH(c.nom||'')} <span class="mut" style="font-size:13px;font-weight:400">· ${VSHORT[kind(c)]||''}${c.lact?' · lact. '+c.lact:''}</span></div>

  for(let i=0;i<td.length-1;i++){if(!td[i].classList.contains('text-right')&&td[i+1].classList.contains('text-right')){const v=hxNum(td[i+1].textContent),l=td[i].textContent.replace(/\s+/g,' ').trim();if(l&&v!=null&&v>=1&&v<=9&&!/^\d/.test(l)){lin.push([l,v]);i++}}}}

function notifPlan(maxDays=30){
 if(!DB)return[];
 const memo={},tk=D=>memo[D]||(memo[D]=tasks(D)),out=[];
 for(let D=todayN;D<todayN+maxDays;D++){
  const items=[];let total=0;
  for(const [k,label] of NCAT){
   const s=NT.cat[k];if(!s.on||AFON[k]===false)continue;
   const adv=Math.max(0,+s.adv||0),E=D+adv;
   let rows=tk(E)[k].filter(r=>!DONE[r.key]);
   if(s.mode==='new'){const pk=new Set(tk(E-1)[k].map(r=>r.key));rows=rows.filter(r=>!pk.has(r.key))}
   if(!rows.length)continue;
   total+=rows.length;items.push({k,label,adv,rows});
  }
  if(!items.length)continue;
  const dt=toDate(D);
  const body=items.map(it=>{const w=it.adv?' '+tr('dans '+it.adv+' j'):'',lb=tr(it.label);return NT.det?`${lb}${w} (${it.rows.length}) : ${it.rows.map(r=>r.c.num).join(', ')}`:`${lb}${w} : ${it.rows.length}`}).join('\n');

 }
 return out;
}

async function scheduleNotifs(){
 if(!NATIVE()||!DB)return 'web';
 const LN=Capacitor.Plugins.LocalNotifications;
 try{
  const pend=await LN.getPending();
  if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  if(!NT.on&&!PT.on&&!alarmPlan().length){NTSTATUS='Rappels et alertes désactivés.';return 'off'}
  let perm=await LN.checkPermissions();
  if(perm.display!=='granted')perm=await LN.requestPermissions();
  if(perm.display!=='granted'){NTSTATUS='Permission refusée : autorise les notifications pour l’application dans les réglages Android.';return 'perm'}
  const now=Date.now()+60000;
  const p1=NT.on?notifPlan().filter(p=>p.at.getTime()>now):[],p2=PT.on?protoPlan().filter(p=>p.at.getTime()>now):[];
  const all=p1.map((p,i)=>({id:1000+i,title:p.title,body:p.body,largeBody:p.body,schedule:{at:p.at,allowWhileIdle:true}})).concat(p2.map((p,i)=>({id:5000+i,title:p.title,body:p.body,largeBody:p.body,schedule:{at:p.at,allowWhileIdle:true}})));
  const p3=alarmPlan().filter(a=>a.at.getTime()>now);
  p3.forEach((a,i)=>all.push({id:8000+i,title:a.title,body:a.body,largeBody:a.body,schedule:{at:a.at,allowWhileIdle:true}}));
  if(all.length)await LN.schedule({notifications:all});
  NTSTATUS=p1.length+' rappel(s) et '+p2.length+' alerte(s) de protocole programmé(s).'+(p3.length?' '+p3.length+' alarme(s) de note.':'');return 'ok';
 }catch(e){NTSTATUS='Erreur : '+e.message;return 'err'}
}

(()=>{for(const ln of I18N_RAW.split('\n')){const a=ln.split('|');if(a.length<3)continue;const fr=a[0],en=a[1],es=a[2];
 if(/[#@%~]/.test(fr)){let re='^';for(const ch of fr){if(ch==='#')re+='(\\d+(?:[.,]\\d+)?)';else if(ch==='@')re+='(\\d{1,4}[\\/\\-.]\\d{1,2}[\\/\\-.]\\d{1,4}|\\d{1,2} \\S+ \\d{4})';else if(ch==='%')re+='(\\S+)';else if(ch==='~')re+='(.+?)';else re+=ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function trSeg(s){const e=TX.get(s);if(e)return e[LANG]||s;
 for(const p of TP){const m=s.match(p.re);if(m){let i=0;return (p[LANG]||s).replace(/[#@%~]/g,c=>{let v=m[++i];if(c==='~')return trSeg2(v);if(LANG==='en'&&/^\d+,\d+$/.test(v))v=v.replace(',','.');return v})}}
 return s}
function trSeg2(s){let r=trSeg(s);if(r!==s)return r;for(const sep of [', ',' ; ']){if(s.includes(sep)){const j=s.split(sep).map(x=>trSeg2b(x)).join(sep);if(j!==s)return j}}return s}
function trSeg2b(s){return trSeg(s.trim())===s.trim()?s:s.replace(s.trim(),trSeg(s.trim()))}
function tr(text){
 if(LANG==='fr'||!text)return text;
 const mm=String(text).match(/^(\s*)([\s\S]*?)(\s*)$/),core=mm[2];if(!core)return text;
 const r=trSeg(core);if(r!==core)return mm[1]+r+mm[3];
 if(core.includes('·')){const j=core.split(/(\s*·\s*)/).map((x,i)=>{if(i%2)return x;const t=x.trim();return t?x.replace(t,trSeg2(t)):x}).join('');if(j!==core)return mm[1]+j+mm[3]}
 const r2=trSeg2(core);return r2!==core?mm[1]+r2+mm[3]:text}

 let st=null,justDragged=false;
 const isB=c=>c.tagName==='BUTTON';
 const end=save=>{if(!st)return;clearTimeout(st.timer);const was=st.drag;st.b.classList.remove('drag');try{st.b.releasePointerCapture(st.pid)}catch(e){}st=null;
  if(was){if(save)onSave([...box.children].filter(isB).map(idOf));justDragged=true;setTimeout(()=>{justDragged=false},80)}};
 box.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.parentElement!==box||(e.pointerType==='mouse'&&e.button!==0))return;
  st={b,pid:e.pointerId,x0:e.clientX,y0:e.clientY,drag:false,timer:setTimeout(()=>{if(!st)return;st.drag=true;st.b.classList.add('drag');try{st.b.setPointerCapture(st.pid)}catch(x){}buzz();},380)}});
 box.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.pid)return;
  if(!st.drag){if(Math.hypot(e.clientX-st.x0,e.clientY-st.y0)>10){clearTimeout(st.timer);st=null}return}
  const x=e.clientX,kids=[...box.children].filter(c=>isB(c)&&c.offsetParent!==null),iB=kids.indexOf(st.b);
  for(let i=0;i<kids.length;i++){const o=kids[i];if(o===st.b)continue;const r=o.getBoundingClientRect(),mid=r.left+r.width/2;
   if(iB<i&&x>mid){box.insertBefore(st.b,o.nextSibling);break}
   if(iB>i&&x<mid){box.insertBefore(st.b,o);break}}
  const br=box.getBoundingClientRect();if(x>br.right-36)box.scrollLeft+=10;else if(x<br.left+36)box.scrollLeft-=10;
  e.preventDefault()});
 box.addEventListener('pointerup',()=>end(true));
 box.addEventListener('pointercancel',()=>end(true));
 box.addEventListener('touchmove',e=>{if(st&&st.drag)e.preventDefault()},{passive:false});
 box.addEventListener('contextmenu',e=>e.preventDefault());
 box.addEventListener('click',e=>{if(justDragged){e.stopPropagation();e.preventDefault()}},true);
}

async function unzipTxt(buf){
 const dv=new DataView(buf);let e=buf.byteLength-22;
 while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
 if(e<0)throw new Error('zip invalide');
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
 for(let i=0;i<n;i++){
  if(dv.getUint32(p,true)!==0x02014b50)break;
  const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lh=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(new Uint8Array(buf,p+46,nl));
  if(/Synchro.*\.txt$/i.test(name)){
   const st=lh+30+dv.getUint16(lh+26,true)+dv.getUint16(lh+28,true),data=new Uint8Array(buf,st,cs);
   if(meth===0)return new TextDecoder().decode(data);
   return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  }
  p+=46+nl+xl+cl;
 }
 throw new Error('fichier Synchro introuvable dans le zip');
}
